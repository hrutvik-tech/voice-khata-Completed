<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bolta Khata — बोलता खाता</title>
  
  <!-- Google Fonts: Poppins (400, 700, 900) & Noto Sans Devanagari (700, 900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8fbf9;
      color: #1a1a2e;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Corner SVG Decorations */
    .corner-decor {
      position: absolute;
      width: 220px;
      height: 220px;
      pointer-events: none;
      z-index: 1;
    }

    .corner-tl {
      top: 0;
      left: 0;
    }

    .corner-br {
      bottom: 0;
      right: 0;
      transform: rotate(180deg);
    }

    /* Main Container */
    .splash-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
    }

    /* 1. Voice AI Khata Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(13, 159, 79, 0.08);
      border: 1.5px solid rgba(13, 159, 79, 0.35);
      color: #0D9F4F;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #0D9F4F;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(13, 159, 79, 0.6);
      }
      50% {
        transform: scale(1.35);
        box-shadow: 0 0 0 5px rgba(13, 159, 79, 0);
      }
    }

    /* 2. Large Mic Icon with Pulsing Rings */
    .mic-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .ring-pulse-1,
    .ring-pulse-2 {
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid #0D9F4F;
      pointer-events: none;
      animation: ring-pulse 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .ring-pulse-2 {
      animation-delay: 1.1s;
    }

    @keyframes ring-pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.75);
        opacity: 0;
      }
    }

    .mic-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #0D9F4F;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(13, 159, 79, 0.2);
      animation: mic-pulse 2s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes mic-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }

    .mic-icon {
      width: 38px;
      height: 38px;
      fill: #0D9F4F;
    }

    /* 3. Hindi Title */
    .hindi-title {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: #1a1a2e;
      line-height: 1.15;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    /* 4. English Title */
    .english-title {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #0D9F4F;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* 5. Tagline */
    .tagline {
      font-size: 13px;
      font-weight: 700;
      color: #666666;
      margin-bottom: 22px;
    }

    /* 6. Animated Waveform (13 Bars) */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 58px;
      margin-bottom: 22px;
    }

    .wave-bar {
      width: 4px;
      border-radius: 4px;
      background: linear-gradient(180deg, #27C76D 0%, #0D9F4F 100%);
      animation: wave-oscillate ease-in-out infinite alternate;
    }

    @keyframes wave-oscillate {
      0% {
        height: 8px;
      }
      100% {
        height: var(--target-h);
      }
    }

    /* 7. Language Pills */
    .lang-pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 9999px;
      letter-spacing: 0.5px;
      transition: transform 0.2s;
    }

    .pill-filled {
      background: #0D9F4F;
      color: #ffffff;
      border: 1.5px solid #0D9F4F;
      box-shadow: 0 4px 12px rgba(13, 159, 79, 0.25);
    }

    .pill-outline {
      background: #ffffff;
      color: #0D9F4F;
      border: 1.5px solid #0D9F4F;
    }

    /* 8. Bottom Tagline with Decorative Lines */
    .sub-tagline-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 22px;
    }

    .decor-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(to right, transparent, #0D9F4F);
    }

    .decor-line.right {
      background: linear-gradient(to left, transparent, #0D9F4F);
    }

    .sub-tagline {
      font-size: 12px;
      font-weight: 700;
      color: #0D9F4F;
      white-space: nowrap;
    }

    /* 9. Shimmer Loading Bar */
    .shimmer-track {
      width: 150px;
      height: 4px;
      background: #e8f5e9;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 24px;
    }

    .shimmer-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #0D9F4F, transparent);
      animation: shimmer-slide 1.25s infinite;
    }

    @keyframes shimmer-slide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(300%);
      }
    }

    /* 10. Powered by Gnani AI */
    .powered-by {
      font-size: 10px;
      font-weight: 600;
      color: rgba(13, 159, 79, 0.65);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Top-Left Corner Decoration -->
  <svg class="corner-decor corner-tl" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Diagonal layered triangles -->
    <polygon points="0,0 230,0 0,230" fill="#e8f5e9" opacity="0.8"/>
    <polygon points="0,0 170,0 0,170" fill="#c8e6c9" opacity="0.6"/>
    <polygon points="0,0 115,0 0,115" fill="#12B85E" opacity="0.85"/>
    <polygon points="0,0 70,0 0,70" fill="#0D9F4F"/>
    
    <!-- Tech/AI mesh network dots and connecting lines -->
    <line x1="25" y1="25" x2="60" y2="35" stroke="#27C76D" stroke-width="1.2" opacity="0.75"/>
    <line x1="60" y1="35" x2="110" y2="25" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="35" x2="75" y2="75" stroke="#27C76D" stroke-width="1.2" opacity="0.75"/>
    <line x1="25" y1="25" x2="35" y2="70" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    <line x1="35" y1="70" x2="75" y2="75" stroke="#27C76D" stroke-width="1.2" opacity="0.75"/>
    <line x1="75" y1="75" x2="140" y2="45" stroke="#27C76D" stroke-width="1" opacity="0.5"/>
    <line x1="75" y1="75" x2="45" y2="125" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    <line x1="35" y1="70" x2="25" y2="115" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    
    <circle cx="25" cy="25" r="3.5" fill="#ffffff" stroke="#0D9F4F" stroke-width="1.5"/>
    <circle cx="60" cy="35" r="3" fill="#ffffff" stroke="#12B85E" stroke-width="1.5"/>
    <circle cx="110" cy="25" r="2.5" fill="#27C76D"/>
    <circle cx="35" cy="70" r="3" fill="#ffffff" stroke="#0D9F4F" stroke-width="1.5"/>
    <circle cx="75" cy="75" r="3.5" fill="#ffffff" stroke="#0D9F4F" stroke-width="1.5"/>
    <circle cx="140" cy="45" r="2.5" fill="#27C76D"/>
    <circle cx="25" cy="115" r="2.5" fill="#27C76D"/>
    <circle cx="45" cy="125" r="3" fill="#ffffff" stroke="#12B85E" stroke-width="1.5"/>
  </svg>

  <!-- Bottom-Right Corner Decoration (Mirrored) -->
  <svg class="corner-decor corner-br" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,0 230,0 0,230" fill="#e8f5e9" opacity="0.8"/>
    <polygon points="0,0 170,0 0,170" fill="#c8e6c9" opacity="0.6"/>
    <polygon points="0,0 115,0 0,115" fill="#12B85E" opacity="0.85"/>
    <polygon points="0,0 70,0 0,70" fill="#0D9F4F"/>
    
    <line x1="25" y1="25" x2="60" y2="35" stroke="#27C76D" stroke-width="1.2" opacity="0.75"/>
    <line x1="60" y1="35" x2="110" y2="25" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="35" x2="75" y2="75" stroke="#27C76D" stroke-width="1.2" opacity="0.75"/>
    <line x1="25" y1="25" x2="35" y2="70" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    <line x1="35" y1="70" x2="75" y2="75" stroke="#27C76D" stroke-width="1.2" opacity="0.75"/>
    <line x1="75" y1="75" x2="140" y2="45" stroke="#27C76D" stroke-width="1" opacity="0.5"/>
    <line x1="75" y1="75" x2="45" y2="125" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    <line x1="35" y1="70" x2="25" y2="115" stroke="#27C76D" stroke-width="1" opacity="0.6"/>
    
    <circle cx="25" cy="25" r="3.5" fill="#ffffff" stroke="#0D9F4F" stroke-width="1.5"/>
    <circle cx="60" cy="35" r="3" fill="#ffffff" stroke="#12B85E" stroke-width="1.5"/>
    <circle cx="110" cy="25" r="2.5" fill="#27C76D"/>
    <circle cx="35" cy="70" r="3" fill="#ffffff" stroke="#0D9F4F" stroke-width="1.5"/>
    <circle cx="75" cy="75" r="3.5" fill="#ffffff" stroke="#0D9F4F" stroke-width="1.5"/>
    <circle cx="140" cy="45" r="2.5" fill="#27C76D"/>
    <circle cx="25" cy="115" r="2.5" fill="#27C76D"/>
    <circle cx="45" cy="125" r="3" fill="#ffffff" stroke="#12B85E" stroke-width="1.5"/>
  </svg>

  <!-- Center Content -->
  <main class="splash-container">
    <!-- 1. Pill Badge -->
    <div class="badge">
      <span class="pulse-dot"></span>
      <span>VOICE AI KHATA</span>
    </div>

    <!-- 2. Mic Icon with Pulsing Rings -->
    <div class="mic-wrapper">
      <div class="ring-pulse-1"></div>
      <div class="ring-pulse-2"></div>
      <div class="mic-circle">
        <svg class="mic-icon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
    </div>

    <!-- 3. Hindi Title -->
    <h1 class="hindi-title">बोलता खाता</h1>

    <!-- 4. English Title -->
    <h2 class="english-title">BOLTA KHATA</h2>

    <!-- 5. Tagline -->
    <p class="tagline">Your Voice. Your Khata. Your Business.</p>

    <!-- 6. 13-Bar Animated Waveform -->
    <div class="waveform">
      <div class="wave-bar" style="--target-h: 22px; animation-duration: 0.85s; animation-delay: 0.1s;"></div>
      <div class="wave-bar" style="--target-h: 36px; animation-duration: 0.72s; animation-delay: 0.25s;"></div>
      <div class="wave-bar" style="--target-h: 48px; animation-duration: 0.95s; animation-delay: 0.05s;"></div>
      <div class="wave-bar" style="--target-h: 32px; animation-duration: 0.68s; animation-delay: 0.3s;"></div>
      <div class="wave-bar" style="--target-h: 54px; animation-duration: 1.05s; animation-delay: 0.15s;"></div>
      <div class="wave-bar" style="--target-h: 42px; animation-duration: 0.78s; animation-delay: 0.4s;"></div>
      <div class="wave-bar" style="--target-h: 55px; animation-duration: 0.88s; animation-delay: 0.0s;"></div>
      <div class="wave-bar" style="--target-h: 38px; animation-duration: 0.92s; animation-delay: 0.35s;"></div>
      <div class="wave-bar" style="--target-h: 50px; animation-duration: 0.75s; animation-delay: 0.2s;"></div>
      <div class="wave-bar" style="--target-h: 30px; animation-duration: 1.02s; animation-delay: 0.45s;"></div>
      <div class="wave-bar" style="--target-h: 45px; animation-duration: 0.82s; animation-delay: 0.12s;"></div>
      <div class="wave-bar" style="--target-h: 34px; animation-duration: 0.7s; animation-delay: 0.28s;"></div>
      <div class="wave-bar" style="--target-h: 20px; animation-duration: 0.9s; animation-delay: 0.18s;"></div>
    </div>

    <!-- 7. Language Pills -->
    <div class="lang-pills">
      <span class="pill pill-filled">HINDI</span>
      <span class="pill pill-outline">ENGLISH</span>
      <span class="pill pill-outline">KANNADA</span>
    </div>

    <!-- 8. Bottom Tagline with Decorative Lines -->
    <div class="sub-tagline-wrapper">
      <div class="decor-line"></div>
      <span class="sub-tagline">आवाज़ से हिसाब • Voice Ledger</span>
      <div class="decor-line right"></div>
    </div>

    <!-- 9. Shimmer Loading Bar -->
    <div class="shimmer-track">
      <div class="shimmer-bar"></div>
    </div>

    <!-- 10. Powered by Gnani AI -->
    <div class="powered-by">Powered by Gnani AI</div>
  </main>

  <script>
    // Redirect to index.html (the login page) after 3 seconds
    setTimeout(function() {
      // If we are at /splash.html or similar, go to index.html / root
      window.location.href = 'index.html';
    }, 3000);
  </script>
</body>
</html>
