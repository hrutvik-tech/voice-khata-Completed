services:
  # 1. Python FastAPI Backend (REST + WebSockets)
  - type: web
    name: bolta-khata-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DB_PATH
        value: ./data/khata.db
      - key: ENCRYPTION_MODE
        value: fernet
      - key: JWT_SECRET
        generateValue: true
      - key: USE_STUB_SPEECH
        value: "true"
      - key: USE_STUB_AI
        value: "false"

  # 2. React Vite Frontend (Light-themed Web App)
  - type: web
    name: bolta-khata-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
